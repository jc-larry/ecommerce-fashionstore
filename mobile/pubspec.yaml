name: fashionstore_mobile
description: Aplicación móvil para clientes de FashionStore con Vestidor Virtual (RA).
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.1.0
  provider: ^6.0.5
  camera: ^0.10.5
  image_picker: ^1.0.7
  # Ventana oficial de PayPal (aprobación del pago sandbox/live) dentro de la app.
  webview_flutter: ^4.10.0
  # Búsqueda de prendas por voz (CU34).
  speech_to_text: ^7.0.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
