<div class="auth-page">
  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="brand-badge mx-auto mb-3"><i class="bi bi-bag-heart-fill"></i></div>
      <h1 class="brand-title mb-1">Crear cuenta</h1>
      <p class="brand-subtitle mb-0">Únete a la experiencia de moda digital de FashionStore.</p>
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger py-2 small d-flex align-items-center gap-2">
      <i class="bi bi-exclamation-triangle-fill"></i> <span>{{ errorMessage }}</span>
    </div>
    <div *ngIf="successMessage" class="alert alert-success py-2 small d-flex align-items-center gap-2">
      <i class="bi bi-check-circle-fill"></i> <span>{{ successMessage }}</span>
    </div>

    <form (ngSubmit)="onSubmit()" #registerForm="ngForm" novalidate>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="field-label">Nombre</label>
          <input type="text" class="form-control" name="firstName" [(ngModel)]="user.firstName" required>
        </div>
        <div class="col-md-6">
          <label class="field-label">Apellido</label>
          <input type="text" class="form-control" name="lastName" [(ngModel)]="user.lastName" required>
        </div>
      </div>

      <div class="mt-3">
        <label class="field-label">Correo Electrónico</label>
        <input type="email" class="form-control" name="email" [(ngModel)]="user.email" placeholder="ejemplo@correo.com" required>
      </div>

      <div class="mt-3">
        <label class="field-label">Teléfono (opcional)</label>
        <input type="tel" class="form-control" name="phone" [(ngModel)]="user.phone" placeholder="+591 70000000">
      </div>

      <div class="mt-3">
        <label class="field-label">Contraseña</label>
        <input type="password" class="form-control" name="password" [(ngModel)]="user.password" required>

        <div class="strength-box mt-2">
          <small class="d-block text-muted fw-bold mb-1">Requisitos de seguridad</small>
          <div class="req" [class.met]="hasMinLength">
            <i class="bi" [ngClass]="hasMinLength ? 'bi-check-circle-fill' : 'bi-circle'"></i> Mínimo 8 caracteres
          </div>
          <div class="req" [class.met]="hasUppercase">
            <i class="bi" [ngClass]="hasUppercase ? 'bi-check-circle-fill' : 'bi-circle'"></i> Una mayúscula
          </div>
          <div class="req" [class.met]="hasLowercase">
            <i class="bi" [ngClass]="hasLowercase ? 'bi-check-circle-fill' : 'bi-circle'"></i> Una minúscula
          </div>
          <div class="req" [class.met]="hasNumber">
            <i class="bi" [ngClass]="hasNumber ? 'bi-check-circle-fill' : 'bi-circle'"></i> Un número
          </div>
          <div class="req" [class.met]="hasSpecial">
            <i class="bi" [ngClass]="hasSpecial ? 'bi-check-circle-fill' : 'bi-circle'"></i> Un carácter especial (&#64;$!%*?&amp;)
          </div>
        </div>
      </div>

      <div class="mt-3">
        <label class="field-label">Confirmar Contraseña</label>
        <input type="password" class="form-control" name="confirmPassword" [(ngModel)]="user.confirmPassword" required>
      </div>

      <div class="form-check mt-3">
        <input type="checkbox" class="form-check-input" id="termsCheck" name="acceptTerms" [(ngModel)]="acceptTerms">
        <label class="form-check-label small text-muted" for="termsCheck">Acepto los términos y condiciones</label>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mt-4" [disabled]="loading">
        <span *ngIf="!loading">Crear mi cuenta</span>
        <span *ngIf="loading" class="spinner-border spinner-border-sm" role="status"></span>
      </button>
    </form>

    <p class="text-center text-muted small mt-4 mb-0">
      ¿Ya tienes una cuenta? <a routerLink="/login" class="fw-500">Inicia sesión</a>
    </p>
  </div>
</div>
