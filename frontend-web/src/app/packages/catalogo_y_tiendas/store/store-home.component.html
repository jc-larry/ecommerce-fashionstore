<div class="store">
  <header class="store-header">
    <div class="d-flex align-items-center gap-2">
      <div class="brand-badge"><i class="bi bi-bag-heart-fill"></i></div>
      <span class="fw-bold fs-5">FashionStore</span>
    </div>
    <div class="d-flex align-items-center gap-3">
      <span class="text-muted small d-none d-sm-inline">Hola, {{ userName }}</span>
      <button class="btn btn-sm btn-outline-primary" (click)="logout()">
        <i class="bi bi-box-arrow-right me-1"></i> Cerrar sesión
      </button>
    </div>
  </header>

  <main class="store-body">
    <div class="hero mb-4">
      <h2 class="fw-bold mb-1">Nueva colección</h2>
      <p class="mb-0 text-white-50">Explora el catálogo. El carrito y la prueba en realidad aumentada llegan en la próxima versión.</p>
    </div>

    <div class="d-flex flex-wrap gap-2 mb-4">
      <div class="input-group input-group-sm" style="max-width: 280px;">
        <span class="input-group-text bg-white"><i class="bi bi-search text-muted"></i></span>
        <input type="text" class="form-control" placeholder="Buscar prenda…" [(ngModel)]="search">
      </div>
      <select class="form-select form-select-sm" style="max-width: 200px;" [(ngModel)]="categoryFilter">
        <option value="TODAS">Todas las categorías</option>
        <option *ngFor="let c of categories" [value]="c.id">{{ c.name }}</option>
      </select>
    </div>

    <p *ngIf="loading" class="text-muted">Cargando catálogo…</p>
    <p *ngIf="!loading && filtered.length === 0" class="text-muted">
      No hay prendas disponibles por el momento.
    </p>

    <div class="row g-4">
      <div class="col-6 col-md-4 col-lg-3" *ngFor="let p of filtered">
        <div class="card h-100 border-0 shadow-sm rounded-4 product">
          <div class="product-img">
            <img *ngIf="primaryImage(p)" [src]="primaryImage(p)" [alt]="p.name">
            <div *ngIf="!primaryImage(p)" class="product-img-placeholder"><i class="bi bi-image"></i></div>
          </div>
          <div class="card-body">
            <div class="text-muted small">{{ categoryName(p) }}</div>
            <div class="fw-bold">{{ p.name }}</div>
            <div class="text-primary fw-bold mt-1">Bs. {{ p.base_price }}</div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
