<div class="admin-page">
  <div class="d-flex flex-wrap gap-3 justify-content-between align-items-center mb-4">
    <h3 class="fw-bold mb-0">Gestión de Proveedores</h3>
    <div class="d-flex flex-wrap gap-2 align-items-center">
      <div class="input-group input-group-sm" style="width: 240px;">
        <span class="input-group-text bg-white"><i class="bi bi-search text-muted"></i></span>
        <input type="text" class="form-control" placeholder="Buscar proveedor…" [(ngModel)]="search">
      </div>
      <button class="btn btn-primary btn-sm fw-bold" (click)="openNew()">
        <i class="bi bi-plus-lg me-1"></i> Nuevo Proveedor
      </button>
    </div>
  </div>

  <div class="alert alert-danger py-2 small" *ngIf="error">{{ error }}</div>

  <div class="card shadow-sm border-0 rounded-4">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover admin-table">
          <thead>
            <tr>
              <th>NIT</th>
              <th>Nombre</th>
              <th>Teléfono</th>
              <th>Email</th>
              <th>Dirección</th>
              <th class="text-end">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngIf="loading"><td colspan="6" class="text-center text-muted py-4">Cargando…</td></tr>
            <tr *ngIf="!loading && filtered.length === 0">
              <td colspan="6" class="text-center text-muted py-4">Sin proveedores registrados.</td>
            </tr>
            <tr *ngFor="let s of filtered">
              <td class="fw-bold small text-muted">{{ s.nit }}</td>
              <td class="fw-bold">{{ s.name }}</td>
              <td class="text-muted small">{{ s.phone || '—' }}</td>
              <td class="text-muted small">{{ s.email || '—' }}</td>
              <td class="text-muted small">{{ s.address || '—' }}</td>
              <td class="text-end">
                <button class="btn btn-sm btn-light border fw-bold me-2" (click)="openEdit(s)">Editar</button>
                <button class="btn btn-sm btn-light border text-danger fw-bold" (click)="remove(s)">Eliminar</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<ng-container *ngIf="showForm">
  <div class="slide-overlay" (click)="closeForm()"></div>
  <div class="slide-panel">
    <div class="slide-panel-header d-flex justify-content-between align-items-center">
      <h5 class="fw-bold mb-0">{{ editingId ? 'Editar proveedor' : 'Nuevo proveedor' }}</h5>
      <button class="btn btn-sm btn-light border-0" (click)="closeForm()"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="slide-panel-body">
      <div class="mb-3">
        <label class="form-label small fw-bold">NIT</label>
        <input class="form-control" [(ngModel)]="form.nit">
      </div>
      <div class="mb-3">
        <label class="form-label small fw-bold">Nombre / Razón social</label>
        <input class="form-control" [(ngModel)]="form.name">
      </div>
      <div class="mb-3">
        <label class="form-label small fw-bold">Email</label>
        <input type="email" class="form-control" [(ngModel)]="form.email">
      </div>
      <div class="mb-3">
        <label class="form-label small fw-bold">Teléfono</label>
        <input class="form-control" [(ngModel)]="form.phone">
      </div>
      <div class="mb-3">
        <label class="form-label small fw-bold">Dirección</label>
        <input class="form-control" [(ngModel)]="form.address">
      </div>
    </div>
    <div class="slide-panel-footer d-flex gap-2 justify-content-end">
      <button class="btn btn-light border" (click)="closeForm()">Cancelar</button>
      <button class="btn btn-primary fw-bold" (click)="save()">Guardar</button>
    </div>
  </div>
</ng-container>
